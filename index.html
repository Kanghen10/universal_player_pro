<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Universal Player</title>

<style>

html,body{
margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;
}

#imgPlayer,
#videoPlayer{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:contain;
background:black;
display:none;
}

#message{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-family:sans-serif;
font-size:1.4em;
text-align:center;
z-index:10;
}

</style>

</head>
<body>

<div id="message">Memuat stream CCTV...</div>

<img id="imgPlayer">

<video id="videoPlayer"
autoplay
muted
playsinline>
</video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const hash = window.location.hash.substring(1);
const streamUrl = decodeURIComponent(hash);

const img = document.getElementById("imgPlayer");
const video = document.getElementById("videoPlayer");
const msg = document.getElementById("message");

let loaded = false;

function fullscreen(){

const elem = document.documentElement;

if(elem.requestFullscreen){
elem.requestFullscreen();
}else if(elem.webkitRequestFullscreen){
elem.webkitRequestFullscreen();
}else if(elem.msRequestFullscreen){
elem.msRequestFullscreen();
}

}

function showError(text){

msg.innerHTML=text;
msg.style.display="block";

img.style.display="none";
video.style.display="none";

}

function playMJPEG(url){

img.src = url + (url.includes("?")?"&":"?")+"t="+Date.now();

img.onload=function(){

loaded=true;

msg.style.display="none";
img.style.display="block";

};

img.onerror=function(){

showError("CCTV sedang Offline atau tidak dapat diakses");

};

}

function playHLS(url){

if(video.canPlayType("application/vnd.apple.mpegurl")){

video.src=url;

video.addEventListener("loadeddata",function(){

loaded=true;

msg.style.display="none";
video.style.display="block";

});

}else if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

loaded=true;

msg.style.display="none";
video.style.display="block";

video.play();

});

hls.on(Hls.Events.ERROR,function(){

showError("Stream HLS tidak dapat diputar");

});

}else{

showError("Browser tidak mendukung HLS");

}

}

function startStream(url){

if(!url || !url.startsWith("http")){

showError("URL stream tidak valid<br>Gunakan format:<br>#https://link-stream");

return;

}

// deteksi HLS
if(url.includes(".m3u8")){

playHLS(url);

}else{

playMJPEG(url);

}

}

setTimeout(function(){

if(!loaded){

msg.innerHTML="Stream tidak merespon";

}

},8000);

window.addEventListener("load",function(){

setTimeout(fullscreen,500);

});

startStream(streamUrl);

</script>

</body>
</html>
